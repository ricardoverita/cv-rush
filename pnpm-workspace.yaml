packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm blocks them by default).
# Everything else (including msgpackr-extract, an optional native speed-up) stays blocked.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true

# Versions shared between a direct dependency and a pinned transitive copy.
catalog:
  # @nestjs/platform-fastify pins its own fastify; the override below makes the server run the
  # same (patched) version we depend on. Bump it here, never in apps/api/package.json.
  fastify: 5.12.5

overrides:
  fastify: 'catalog:'
