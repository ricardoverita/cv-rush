version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Respect a minimum release age (also enforced by pnpm's supply-chain policy).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors held back on purpose (decision log D-064, D-069): typescript-eslint doesn't support
      # TypeScript 7 yet; Next.js lint plugins require ESLint 9; NestJS stays on 11 while the first
      # vertical slices are built. Upgrade them manually, each in its own pull request.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      # Types must match the runtime we target (Node.js 24 LTS).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
