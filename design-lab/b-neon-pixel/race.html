<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B · Neon Pixel Campus · Race</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img"
        aria-label="Night tech campus: Ricardo runs third toward four holographic portals A to D; Kestrel Pay HQ glows in the distance">
        <rect width="1600" height="900" fill="url(#b-sky)" />
        <g id="stars"></g>

        <!-- far campus skyline -->
        <g class="parallax-far" shape-rendering="crispEdges">
          <g fill="#1E1A3D">
            <rect x="-40" y="430" width="180" height="370" /><rect x="140" y="500" width="120" height="300" />
            <rect x="260" y="470" width="130" height="330" /><rect x="520" y="410" width="140" height="390" />
            <rect x="900" y="450" width="110" height="350" /><rect x="1010" y="500" width="150" height="300" />
          </g>
          <g fill="#2A2456">
            <rect x="0" y="400" width="100" height="30" /><rect x="540" y="380" width="100" height="30" /><rect x="920" y="420" width="70" height="30" />
          </g>
          <g fill="#FFB547" opacity=".7">
            <rect x="14" y="460" width="14" height="14" /><rect x="70" y="460" width="14" height="14" /><rect x="42" y="516" width="14" height="14" /><rect x="98" y="572" width="14" height="14" />
            <rect x="290" y="500" width="14" height="14" /><rect x="346" y="556" width="14" height="14" />
            <rect x="548" y="440" width="14" height="14" /><rect x="604" y="496" width="14" height="14" /><rect x="576" y="552" width="14" height="14" />
            <rect x="930" y="480" width="14" height="14" /><rect x="1040" y="530" width="14" height="14" /><rect x="1096" y="586" width="14" height="14" />
          </g>
          <g fill="#2DE2E6" opacity=".55">
            <rect x="42" y="460" width="14" height="14" /><rect x="160" y="530" width="14" height="14" /><rect x="632" y="440" width="14" height="14" /><rect x="958" y="536" width="14" height="14" />
          </g>
          <!-- "THE CLOUD" data center -->
          <g filter="url(#b-glow)">
            <rect x="10" y="340" width="150" height="44" fill="#0E0B1F" stroke="#A98CFF" stroke-width="4" />
            <text x="85" y="370" text-anchor="middle" font-family="Silkscreen" font-size="18" fill="#A98CFF">THE CLOUD</text>
          </g>
          <!-- Culture Fit neon, one letter dying -->
          <g filter="url(#b-glow)" font-family="Silkscreen" font-size="22">
            <rect x="268" y="520" width="114" height="62" fill="#0E0B1F" stroke="#FF3E9A" stroke-width="4" />
            <text x="325" y="546" text-anchor="middle" fill="#FF3E9A">CULTURE</text>
            <text x="300" y="572" text-anchor="middle" fill="#FF3E9A">F</text>
            <text class="flicker" x="316" y="572" text-anchor="middle" fill="#FF3E9A">I</text>
            <text x="334" y="572" text-anchor="middle" fill="#FF3E9A">T</text>
          </g>
        </g>

        <!-- Kestrel Pay HQ: the goal, always lit -->
        <use href="#b-hq" x="680" y="230" width="190" height="525" />

        <!-- Quick 15-minute call: an LED billboard that has been counting for hours -->
        <g transform="translate(330 330)" shape-rendering="crispEdges">
          <rect x="102" y="110" width="14" height="360" fill="#3B2F6E" />
          <rect x="-10" width="240" height="112" fill="#0E0B1F" stroke="#FFB547" stroke-width="5" />
          <text x="110" y="36" text-anchor="middle" font-family="Silkscreen" font-size="17" fill="#FFB547">QUICK 15-MIN CALL</text>
          <text x="110" y="88" text-anchor="middle" font-family="Silkscreen" font-size="38" fill="#FF3E9A" filter="url(#b-glow)">01:47:12</text>
        </g>

        <!-- "We'll get back to you": a drone that never finishes sending -->
        <g transform="translate(150 170)">
          <g class="drone"><use href="#b-drone" width="300" height="90" /></g>
          <g shape-rendering="crispEdges">
            <rect x="172" y="34" width="250" height="52" fill="#0E0B1F" stroke="#2DE2E6" stroke-width="3" />
            <text x="186" y="56" font-family="Silkscreen" font-size="13" fill="#F2F4FF">WE'LL GET BACK TO YOU</text>
            <rect x="186" y="66" width="190" height="10" fill="#3B2F6E" /><rect x="186" y="66" width="8" height="10" fill="#2DE2E6" />
            <text x="384" y="76" font-family="Silkscreen" font-size="11" fill="#2DE2E6">2%</text>
          </g>
        </g>

        <!-- ground: campus walkway with a neon edge -->
        <g shape-rendering="crispEdges">
          <rect x="0" y="800" width="1600" height="100" fill="#1E1A3D" />
          <rect x="0" y="830" width="1600" height="4" fill="#3B2F6E" />
          <g class="parallax-near" id="joints"></g>
          <rect x="0" y="796" width="1600" height="8" fill="#2DE2E6" filter="url(#b-glow)" />
        </g>

        <!-- 237 applicants: LED counter at the start line -->
        <g transform="translate(16 680)" shape-rendering="crispEdges">
          <rect x="70" y="56" width="12" height="64" fill="#3B2F6E" />
          <rect width="170" height="58" fill="#0E0B1F" stroke="#B7F34B" stroke-width="4" />
          <text x="85" y="26" text-anchor="middle" font-family="Silkscreen" font-size="20" fill="#B7F34B">237</text>
          <text x="85" y="46" text-anchor="middle" font-family="Silkscreen" font-size="13" fill="#B7F34B">APPLICANTS</text>
        </g>

        <!-- platforms: a server rack, then hover pads -->
        <use href="#b-rack" x="930" y="690" width="126" height="112" />
        <g shape-rendering="crispEdges">
          <rect x="980" y="530" width="126" height="20" fill="#3B2F6E" /><rect x="980" y="530" width="126" height="6" fill="#2DE2E6" />
          <rect class="b-blink" x="1000" y="550" width="14" height="10" fill="#FF3E9A" /><rect class="b-blink" x="1072" y="550" width="14" height="10" fill="#FF3E9A" />
          <rect x="1010" y="390" width="112" height="20" fill="#3B2F6E" /><rect x="1010" y="390" width="112" height="6" fill="#2DE2E6" />
          <rect class="b-blink" x="1028" y="410" width="14" height="10" fill="#FF3E9A" /><rect class="b-blink" x="1090" y="410" width="14" height="10" fill="#FF3E9A" />
        </g>

        <!-- the portal tower: four floors, four portals -->
        <g shape-rendering="crispEdges">
          <rect x="1150" y="250" width="420" height="550" fill="#161233" stroke="#3B2F6E" stroke-width="6" />
          <g fill="#3B2F6E"><rect x="1150" y="250" width="420" height="12" /></g>
          <g fill="#2A2456">
            <rect x="1120" y="380" width="460" height="18" /><rect x="1120" y="520" width="460" height="18" /><rect x="1120" y="660" width="460" height="18" />
          </g>
          <g fill="#2DE2E6">
            <rect x="1120" y="380" width="460" height="5" /><rect x="1120" y="520" width="460" height="5" /><rect x="1120" y="660" width="460" height="5" />
          </g>
        </g>
        <g class="portal" transform="translate(1420 240)"><use href="#b-portal" width="140" height="140" /></g>
        <g class="portal" transform="translate(1420 380)"><use href="#b-portal" width="140" height="140" /></g>
        <g class="portal selected" transform="translate(1420 520)">
          <rect class="pulse" x="0" y="6" width="140" height="138" fill="none" stroke="#FF3E9A" stroke-width="6" filter="url(#b-glow)" />
          <use href="#b-portal" width="140" height="140" />
        </g>
        <g class="portal" transform="translate(1420 660)"><use href="#b-portal" width="140" height="140" /></g>
        <g id="plates"></g>

        <!-- path hint: magenta pixels toward portal C -->
        <path d="M560 700 Q760 560 960 640 T1170 610" fill="none" stroke="#FF3E9A" stroke-width="8" stroke-dasharray="8 18" opacity=".9" shape-rendering="crispEdges" />

        <!-- obstacle: the take-home task, a hologram barrier still loading -->
        <g transform="translate(738 676)" shape-rendering="crispEdges">
          <rect x="0" y="0" width="140" height="124" fill="#2DE2E6" opacity=".14" />
          <rect x="0" y="0" width="140" height="124" fill="url(#b-scan)" />
          <rect x="0" y="0" width="140" height="124" fill="none" stroke="#2DE2E6" stroke-width="4" />
          <text x="70" y="30" text-anchor="middle" font-family="Silkscreen" font-size="13" fill="#F2F4FF">TAKE-HOME</text>
          <text x="70" y="48" text-anchor="middle" font-family="Silkscreen" font-size="13" fill="#F2F4FF">TASK</text>
          <text x="70" y="74" text-anchor="middle" font-family="Silkscreen" font-size="11" fill="#FFB547">EST. 8H</text>
          <rect x="16" y="88" width="108" height="12" fill="#3B2F6E" /><rect x="16" y="88" width="6" height="12" fill="#FFB547" />
        </g>

        <!-- runners (Sofia 1st, Mateo 2nd, Ricardo 3rd, Alex 4th) -->
        <g fill="#2DE2E6" opacity=".18" shape-rendering="crispEdges">
          <rect x="985" y="524" width="112" height="6" /><rect x="600" y="798" width="112" height="6" /><rect x="400" y="798" width="112" height="6" /><rect x="170" y="798" width="112" height="6" />
        </g>
        <g class="advance"><use class="runner sofia" href="#b-dev" x="975" y="383" width="140" height="147" style="--phase:-.12s" /></g>
        <g class="advance"><use class="runner mateo" href="#b-dev" x="600" y="653" width="140" height="147" style="--phase:-.24s" /></g>
        <use class="runner ricardo" href="#b-dev" x="400" y="653" width="140" height="147" />
        <g class="fall-behind"><use class="runner alex" href="#b-dev" x="170" y="653" width="140" height="147" style="--phase:-.3s" /></g>
        <!-- glitch pixels falling off Ricardo's damaged CV -->
        <g shape-rendering="crispEdges">
          <rect class="glitch" x="533" y="730" width="7" height="7" fill="#FF3E9A" />
          <rect class="glitch" x="526" y="716" width="7" height="7" fill="#F2F4FF" style="--phase:-.4s" />
          <rect class="glitch" x="540" y="744" width="7" height="7" fill="#2DE2E6" style="--phase:-.7s" />
        </g>

        <!-- name tags -->
        <g font-family="Silkscreen" font-size="17" text-anchor="middle" shape-rendering="crispEdges">
          <g class="advance"><g transform="translate(1032 362)"><rect x="-46" y="-20" width="92" height="28" fill="#0E0B1F" stroke="#FF3E9A" stroke-width="3" /><text y="1" fill="#F2F4FF">SOFIA</text></g></g>
          <g class="advance"><g transform="translate(656 632)"><rect x="-48" y="-20" width="96" height="28" fill="#0E0B1F" stroke="#FFB547" stroke-width="3" /><text y="1" fill="#F2F4FF">MATEO</text></g></g>
          <g transform="translate(456 630)"><rect x="-62" y="-22" width="124" height="32" fill="#2DE2E6" /><text y="2" fill="#0E0B1F" data-s="player.name">RICARDO</text><path d="M-8 10 h16 v6 h-4 v6 h-8 v-6 h-4 z" fill="#2DE2E6" /></g>
          <g class="fall-behind"><g transform="translate(226 632)"><rect x="-38" y="-20" width="76" height="28" fill="#0E0B1F" stroke="#A98CFF" stroke-width="3" /><text y="1" fill="#F2F4FF">ALEX</text></g></g>
        </g>
      </svg>

      <div class="hud">
        <div class="player-card panel">
          <div class="name" data-s="player.name">RICARDO</div>
          <div class="title" data-s="player.title">Senior Fullstack Developer</div>
          <div class="cv-meter">
            <span class="icon" aria-hidden="true"></span>
            <span class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span>
            <span>CV <span data-s="cvHealth">80</span>%</span>
          </div>
          <div class="stages" aria-label="Recruiter passed, ATS passed, Hiring Manager now, Final next">
            <span class="done">REC</span><span class="done">ATS</span><span class="now">HM</span><span>FIN</span>
          </div>
        </div>

        <div class="question panel">
          <div class="bar"><span>◆ HIRING MANAGER · <span data-s="technical.counter"></span></span><span class="timer">0:0<span data-s="technical.seconds">9</span></span></div>
          <div class="prompt" data-s="technical.prompt">Which Redis structure fits a real-time leaderboard?</div>
        </div>

        <div class="race-status">
          <div class="score panel"><small>SCORE</small><span data-s="score">12,480</span></div>
          <div class="position panel"><b data-s="position" style="text-transform: uppercase">3rd</b><small>OF 4</small></div>
        </div>

        <div class="hint panel">
          <span class="desktop">RUN INTO A PORTAL · <kbd>↑</kbd> <kbd>↓</kbd> OR <kbd>1</kbd>-<kbd>4</kbd></span>
          <span class="phone">TAP A SIGN TO PICK</span>
        </div>

        <div class="touch"><div class="jump">JUMP</div></div>
      </div>

      <div class="rotate">
        <div class="phone" aria-hidden="true"></div>
        <div>ROTATE YOUR DEVICE TO PLAY</div>
      </div>
    </div>
    <script src="../shared/scenario.js"></script>
    <script src="sprites.js"></script>
    <script src="scene.js"></script>
    <script>
      window.pixelStars('stars', 70, 470);
      window.groundJoints('joints');
      window.answerPlates('plates', window.SCENARIO.technical);
    </script>
  </body>
</html>
