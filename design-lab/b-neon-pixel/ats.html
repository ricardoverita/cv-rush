<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B · Neon Pixel Campus · ATS 9000</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img"
        aria-label="The ATS-9000 mainframe sweeps the lane with a laser; Ricardo collects his stack keywords and avoids glitched buzzwords">
        <rect width="1600" height="900" fill="url(#b-sky)" />
        <g id="stars"></g>
        <g class="parallax-far" shape-rendering="crispEdges"><g id="skyline"></g></g>

        <use href="#b-hq" x="600" y="300" width="160" height="442" />

        <!-- ground -->
        <g shape-rendering="crispEdges">
          <rect x="0" y="800" width="1600" height="100" fill="#1E1A3D" />
          <rect x="0" y="830" width="1600" height="4" fill="#3B2F6E" />
          <g class="parallax-near" id="joints"></g>
          <rect x="0" y="796" width="1600" height="8" fill="#2DE2E6" filter="url(#b-glow)" />
        </g>

        <!-- ATS-9000 mainframe -->
        <use href="#b-ats" x="1180" y="240" width="380" height="560" />

        <!-- shredded applicant CVs falling into /dev/null -->
        <g shape-rendering="crispEdges">
          <rect class="shred" x="1420" y="572" width="14" height="14" fill="#F2F4FF" />
          <rect class="shred" x="1452" y="572" width="7" height="14" fill="#8A8FB5" style="--phase:-.5s" />
          <rect class="shred" x="1480" y="572" width="14" height="7" fill="#FF3E9A" style="--phase:-1s" />
          <rect class="shred" x="1508" y="572" width="7" height="14" fill="#F2F4FF" style="--phase:-.25s" />
        </g>
        <g transform="translate(1410 684)" shape-rendering="crispEdges">
          <rect width="150" height="116" fill="#2A2456" stroke="#8A8FB5" stroke-width="5" />
          <rect x="-8" y="-12" width="166" height="16" fill="#3B2F6E" stroke="#8A8FB5" stroke-width="4" />
          <text x="75" y="46" text-anchor="middle" font-family="Silkscreen" font-size="20" fill="#F2F4FF">/dev/null</text>
          <text x="75" y="76" text-anchor="middle" font-family="Silkscreen" font-size="12" fill="#FF3E9A" data-s="ats.rejectedPile">Auto-rejected</text>
        </g>

        <!-- the scan laser: sweeps the lane in steps -->
        <g class="laser">
          <path d="M1300 400 L940 800 L1060 800 Z" fill="#FF3E9A" opacity=".16" />
          <path d="M1300 400 L1000 800" stroke="#FF3E9A" stroke-width="5" opacity=".9" />
          <rect x="930" y="794" width="140" height="10" fill="#FF3E9A" opacity=".7" shape-rendering="crispEdges" />
        </g>

        <g id="tokens"></g>

        <!-- Ricardo just grabbed a keyword -->
        <g transform="translate(470 590)"><g class="pop">
          <text text-anchor="middle" font-family="Silkscreen" font-size="22" fill="#B7F34B" filter="url(#b-glow)">+ REDIS</text>
        </g></g>

        <!-- runners -->
        <g fill="#2DE2E6" opacity=".18" shape-rendering="crispEdges">
          <rect x="1250" y="798" width="112" height="6" /><rect x="960" y="798" width="112" height="6" /><rect x="400" y="798" width="112" height="6" /><rect x="170" y="798" width="112" height="6" />
        </g>
        <g class="advance"><use class="runner sofia" href="#b-dev" x="1240" y="653" width="140" height="147" style="--phase:-.12s" /></g>
        <use class="runner mateo" href="#b-dev" x="950" y="653" width="140" height="147" style="--phase:-.24s" />
        <use class="runner ricardo" href="#b-dev" x="400" y="653" width="140" height="147" />
        <g class="fall-behind"><use class="runner alex" href="#b-dev" x="170" y="653" width="140" height="147" style="--phase:-.3s" /></g>
        <g shape-rendering="crispEdges">
          <rect class="glitch" x="533" y="730" width="7" height="7" fill="#FF3E9A" />
          <rect class="glitch" x="526" y="716" width="7" height="7" fill="#F2F4FF" style="--phase:-.4s" />
          <rect class="glitch" x="540" y="744" width="7" height="7" fill="#2DE2E6" style="--phase:-.7s" />
        </g>

        <g font-family="Silkscreen" font-size="17" text-anchor="middle" shape-rendering="crispEdges">
          <g class="advance"><g transform="translate(1296 632)"><rect x="-74" y="-20" width="148" height="28" fill="#0E0B1F" stroke="#B7F34B" stroke-width="3" /><text y="1" fill="#F2F4FF">SOFIA <tspan fill="#B7F34B">PASS</tspan></text></g></g>
          <g transform="translate(1006 632)"><rect x="-48" y="-20" width="96" height="28" fill="#0E0B1F" stroke="#FFB547" stroke-width="3" /><text y="1" fill="#F2F4FF">MATEO</text></g>
          <g transform="translate(456 630)"><rect x="-62" y="-22" width="124" height="32" fill="#2DE2E6" /><text y="2" fill="#0E0B1F" data-s="player.name">RICARDO</text><path d="M-8 10 h16 v6 h-4 v6 h-8 v-6 h-4 z" fill="#2DE2E6" /></g>
          <g class="fall-behind"><g transform="translate(226 632)"><rect x="-38" y="-20" width="76" height="28" fill="#0E0B1F" stroke="#A98CFF" stroke-width="3" /><text y="1" fill="#F2F4FF">ALEX</text></g></g>
        </g>
      </svg>

      <div class="hud">
        <div class="player-card panel">
          <div class="name" data-s="player.name">RICARDO</div>
          <div class="title" data-s="player.title">Senior Fullstack Developer</div>
          <div class="cv-meter">
            <span class="icon" aria-hidden="true"></span>
            <span class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span>
            <span>CV <span data-s="cvHealth">80</span>%</span>
          </div>
          <div class="stages" aria-label="Recruiter passed, ATS now, Hiring Manager and Final next">
            <span class="done">REC</span><span class="now">ATS</span><span>HM</span><span>FIN</span>
          </div>
        </div>

        <div class="question panel ats">
          <div class="bar"><span>◆ ATS 9000 · KEYWORD SCAN</span><span class="timer">0:<span data-s="ats.seconds">14</span></span></div>
          <div class="match">
            <span class="big">MATCH <span data-s="ats.match">82</span>%</span>
            <div class="meter" aria-hidden="true"><span class="fill" style="width: 82%"></span><span class="line" style="left: 70%"></span></div>
          </div>
          <div class="chips" id="chips"></div>
        </div>

        <div class="race-status">
          <div class="score panel"><small>SCORE</small><span data-s="score">12,480</span></div>
          <div class="position panel"><b data-s="position" style="text-transform: uppercase">3rd</b><small>OF 4</small></div>
        </div>

        <div class="hint panel">
          <span class="desktop">GRAB YOUR STACK · DODGE BUZZWORDS · <kbd>SPACE</kbd> JUMP</span>
          <span class="phone">GRAB YOUR STACK</span>
        </div>

        <div class="touch"><div class="jump">JUMP</div></div>
      </div>

      <div class="rotate">
        <div class="phone" aria-hidden="true"></div>
        <div>ROTATE YOUR DEVICE TO PLAY</div>
      </div>
    </div>
    <script src="../shared/scenario.js"></script>
    <script src="sprites.js"></script>
    <script src="scene.js"></script>
    <script>
      window.pixelStars('stars', 70, 470);
      window.campusSkyline('skyline', [[-40, 450, 170], [130, 520, 120], [250, 480, 140], [870, 470, 130], [1000, 430, 150]]);
      window.groundJoints('joints');
      const ats = window.SCENARIO.ats;
      window.keywordTokens('tokens', ats, {
        PHP: [640, 610],
        PostgreSQL: [800, 520],
        Ninja: [590, 460],
        '10x': [740, 720],
        Synergy: [860, 650],
        Spark: [820, 400],
      });
      document.getElementById('chips').innerHTML =
        ats.collected.map((t) => `<span>${t} ✓</span>`).join('') +
        ats.upcoming.map((t) => `<span class="todo">${t}</span>`).join('');
    </script>
  </body>
</html>
