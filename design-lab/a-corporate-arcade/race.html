<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A · Corporate Arcade · Race</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img"
        aria-label="Ricardo runs third toward four elevator doors A to D; Kestrel Pay HQ in the distance">
        <rect width="1600" height="900" fill="var(--sky)" />

        <!-- clouds (parallax) -->
        <g class="parallax-clouds">
          <use href="#a-cloud" x="120" y="70" width="180" height="72" />
          <use href="#a-cloud" x="560" y="40" width="150" height="60" />
          <use href="#a-cloud" x="980" y="90" width="200" height="80" />
          <use href="#a-cloud" x="1420" y="50" width="160" height="64" />
          <use href="#a-cloud" x="1840" y="80" width="180" height="72" />
        </g>
        <!-- "We'll get back to you": a paper plane that never lands -->
        <g transform="translate(470 200) rotate(-6)">
          <path d="M0 20 L60 0 L30 34 Z" fill="#fff" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" />
          <path d="M66 6 q20 -6 26 6" fill="none" stroke="var(--ink)" stroke-width="3" stroke-dasharray="4 6" />
          <rect x="96" y="-8" width="214" height="34" rx="17" fill="#fff" stroke="var(--ink)" stroke-width="4" />
          <text x="203" y="15" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="16" fill="var(--ink)">We'll get back to you</text>
        </g>

        <!-- far city -->
        <g class="parallax-far">
          <g stroke="var(--ink)" stroke-width="4">
            <rect x="0" y="470" width="120" height="330" rx="8" fill="#c7b9ff" />
            <rect x="120" y="420" width="90" height="380" rx="8" fill="#ffd0b0" />
            <rect x="210" y="500" width="140" height="300" rx="8" fill="#9fe3d6" />
            <rect x="560" y="440" width="110" height="360" rx="8" fill="#c7b9ff" />
            <rect x="890" y="480" width="110" height="320" rx="8" fill="#ffd0b0" />
            <rect x="1000" y="420" width="100" height="380" rx="8" fill="#9fe3d6" />
          </g>
          <g fill="#fff6d8" opacity=".9">
            <rect x="20" y="500" width="18" height="22" /><rect x="58" y="500" width="18" height="22" /><rect x="20" y="545" width="18" height="22" /><rect x="58" y="590" width="18" height="22" />
            <rect x="140" y="450" width="16" height="20" /><rect x="176" y="490" width="16" height="20" /><rect x="140" y="530" width="16" height="20" />
            <rect x="580" y="470" width="18" height="22" /><rect x="618" y="510" width="18" height="22" /><rect x="580" y="555" width="18" height="22" />
            <rect x="1020" y="450" width="18" height="22" /><rect x="1058" y="495" width="18" height="22" />
          </g>
          <!-- Culture Fit poster -->
          <g transform="translate(222 520) rotate(-3)">
            <rect width="116" height="96" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4" />
            <path d="M34 24 h18 a8 8 0 1 1 14 0 h18 v18 a8 8 0 1 0 0 14 v18 h-50 z" fill="var(--tomato)" stroke="var(--ink)" stroke-width="3" />
            <text x="58" y="88" text-anchor="middle" font-family="Lilita One" font-size="17" fill="var(--ink)">CULTURE FIT</text>
          </g>
        </g>

        <!-- Kestrel Pay HQ: the goal, ahead and always visible -->
        <use href="#a-hq" x="690" y="250" width="180" height="458" />

        <!-- Quick 15-minute call billboard -->
        <g transform="translate(330 330)">
          <rect x="96" y="96" width="14" height="380" fill="#8e86a8" stroke="var(--ink)" stroke-width="4" />
          <rect x="-14" width="242" height="104" rx="14" fill="var(--sunflower)" stroke="var(--ink)" stroke-width="5" />
          <text x="107" y="40" text-anchor="middle" font-family="Lilita One" font-size="22" fill="var(--ink)">QUICK 15-MIN CALL</text>
          <rect x="44" y="54" width="126" height="34" rx="8" fill="var(--ink)" />
          <text x="107" y="79" text-anchor="middle" font-family="Lilita One" font-size="22" fill="var(--tomato)">01:47:12</text>
        </g>

        <!-- ground: office carpet -->
        <rect x="0" y="800" width="1600" height="100" fill="var(--carpet)" />
        <rect x="0" y="800" width="1600" height="100" fill="url(#a-dots)" />
        <path d="M0 800 H1600" stroke="var(--ink)" stroke-width="6" />
        <g class="speedlines" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8">
          <path d="M300 690 h-70" /><path d="M290 720 h-50" /><path d="M310 750 h-80" />
        </g>

        <!-- 237 applicants: start line sign -->
        <g transform="translate(20 690)">
          <rect x="70" y="40" width="12" height="70" fill="#8e86a8" stroke="var(--ink)" stroke-width="4" />
          <rect width="152" height="48" rx="12" fill="#fff" stroke="var(--ink)" stroke-width="4" />
          <text x="76" y="31" text-anchor="middle" font-family="Lilita One" font-size="20" fill="var(--ink)">237 applicants</text>
        </g>

        <!-- jump platforms (desks) toward the upper doors -->
        <g stroke="var(--ink)" stroke-width="5">
          <rect x="930" y="670" width="140" height="24" rx="6" fill="var(--peach)" />
          <path d="M945 694 v40 M1055 694 v40" />
          <rect x="980" y="530" width="120" height="24" rx="6" fill="var(--peach)" />
          <rect x="1010" y="390" width="110" height="24" rx="6" fill="var(--peach)" />
        </g>

        <!-- the answer tower: four floors, four elevator doors -->
        <g stroke="var(--ink)" stroke-width="5">
          <rect x="1150" y="250" width="420" height="550" rx="10" fill="#efe7d6" />
          <rect x="1150" y="250" width="420" height="550" rx="10" fill="url(#a-dots)" />
          <rect x="1120" y="380" width="460" height="22" rx="6" fill="#d8cfbd" />
          <rect x="1120" y="520" width="460" height="22" rx="6" fill="#d8cfbd" />
          <rect x="1120" y="660" width="460" height="22" rx="6" fill="#d8cfbd" />
        </g>
        <!-- doors: A (top) to D (ground) -->
        <g class="door" transform="translate(1420 244)"><use href="#a-door" width="140" height="140" /></g>
        <g class="door" transform="translate(1420 384)"><use href="#a-door" width="140" height="140" /></g>
        <g class="door selected" transform="translate(1420 524)">
          <rect class="glow" x="4" y="10" width="136" height="134" rx="16" fill="none" stroke="var(--tomato)" stroke-width="10" />
          <use href="#a-door" width="140" height="140" />
        </g>
        <g class="door" transform="translate(1420 664)"><use href="#a-door" width="140" height="140" /></g>
        <!-- answer signs -->
        <g font-family="Lilita One" font-size="26" fill="var(--ink)">
          <g transform="translate(1176 300)">
            <rect width="230" height="56" rx="14" fill="#fff" stroke="var(--ink)" stroke-width="5" />
            <circle cx="28" cy="28" r="20" fill="var(--sunflower)" stroke="var(--ink)" stroke-width="4" /><text x="28" y="37" text-anchor="middle">A</text>
            <text x="58" y="37" data-s="technical.options.A">List</text>
          </g>
          <g transform="translate(1176 440)">
            <rect width="230" height="56" rx="14" fill="#fff" stroke="var(--ink)" stroke-width="5" />
            <circle cx="28" cy="28" r="20" fill="var(--sunflower)" stroke="var(--ink)" stroke-width="4" /><text x="28" y="37" text-anchor="middle">B</text>
            <text x="58" y="37" data-s="technical.options.B">Set</text>
          </g>
          <g transform="translate(1176 580)">
            <rect width="230" height="56" rx="14" fill="var(--tomato)" stroke="var(--ink)" stroke-width="5" />
            <circle cx="28" cy="28" r="20" fill="#fff" stroke="var(--ink)" stroke-width="4" /><text x="28" y="37" text-anchor="middle">C</text>
            <text x="58" y="37" fill="#fff" data-s="technical.options.C">Sorted set</text>
          </g>
          <g transform="translate(1176 720)">
            <rect width="230" height="56" rx="14" fill="#fff" stroke="var(--ink)" stroke-width="5" />
            <circle cx="28" cy="28" r="20" fill="var(--sunflower)" stroke="var(--ink)" stroke-width="4" /><text x="28" y="37" text-anchor="middle">D</text>
            <text x="58" y="37" data-s="technical.options.D">String</text>
          </g>
        </g>
        <!-- path hint: Ricardo is heading to C -->
        <path d="M560 700 Q760 560 960 640 T1170 610" fill="none" stroke="var(--tomato)" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round" opacity=".8" />

        <!-- obstacle -->
        <use href="#a-takehome" x="740" y="690" width="130" height="112" />

        <!-- runners (Sofia 1st, Mateo 2nd, Ricardo 3rd, Alex 4th) -->
        <g class="advance"><use class="runner sofia" href="#a-dev" x="1000" y="360" width="120" height="152" style="--phase:-.1s" /></g>
        <g class="advance"><use class="runner mateo" href="#a-dev" x="600" y="652" width="120" height="152" style="--phase:-.2s" /></g>
        <use class="runner ricardo" href="#a-dev" x="400" y="652" width="120" height="152" />
        <g class="fall-behind"><use class="runner alex" href="#a-dev" x="170" y="652" width="120" height="152" style="--phase:-.25s" /></g>
        <!-- a scrap falling from Ricardo's damaged CV -->
        <rect class="scrap" x="512" y="690" width="12" height="14" rx="2" fill="#fff" stroke="var(--ink)" stroke-width="2.5" />

        <!-- name tags -->
        <g font-family="Lilita One" font-size="20" text-anchor="middle">
          <g class="advance"><g transform="translate(1048 350)"><rect x="-44" y="-22" width="88" height="30" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4" /><text y="1">SOFIA</text></g></g>
          <g class="advance"><g transform="translate(648 642)"><rect x="-46" y="-22" width="92" height="30" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4" /><text y="1">MATEO</text></g></g>
          <g transform="translate(448 642)"><rect x="-60" y="-24" width="120" height="34" rx="11" fill="var(--tomato)" stroke="var(--ink)" stroke-width="4" /><text y="2" fill="#fff" data-s="player.name">RICARDO</text></g>
          <g class="fall-behind"><g transform="translate(218 642)"><rect x="-38" y="-22" width="76" height="30" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4" /><text y="1">ALEX</text></g></g>
        </g>
      </svg>

      <div class="hud">
        <div class="player-card sticker">
          <div class="name" data-s="player.name">RICARDO</div>
          <div class="title" data-s="player.title">Senior Fullstack Developer</div>
          <div class="cv-meter">
            <span class="icon" aria-hidden="true"></span>
            <span class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span>
            <span>CV <span data-s="cvHealth">80</span>%</span>
          </div>
          <div class="stages" aria-label="Recruiter passed, ATS passed, Hiring Manager now, Final next">
            <span class="done">📞</span><span class="done">🤖</span><span class="now">💼</span><span>🏢</span>
          </div>
        </div>

        <div class="question sticker">
          <span class="tab"><span data-s="technical.icon"></span> HIRING MANAGER · <span data-s="technical.counter"></span></span>
          <div class="prompt" data-s="technical.prompt">Which Redis structure fits a real-time leaderboard?</div>
          <div class="timer"><span data-s="technical.seconds">9</span></div>
        </div>

        <div class="race-status">
          <div class="score sticker"><small>SCORE</small><span data-s="score">12,480</span></div>
          <div class="position sticker"><div><b data-s="position">3rd</b><small>of 4</small></div></div>
        </div>

        <div class="hint sticker">
          <span class="desktop">Run through a door · <kbd>↑</kbd> <kbd>↓</kbd> or <kbd>1</kbd>–<kbd>4</kbd></span>
          <span class="phone">Tap a door sign to take it</span>
        </div>

        <div class="touch"><div class="jump">JUMP</div></div>
      </div>

      <div class="rotate">
        <div class="phone" aria-hidden="true"></div>
        <div>Rotate your device to play</div>
      </div>
    </div>
    <script src="../shared/scenario.js"></script>
    <script src="sprites.js"></script>
  </body>
</html>
