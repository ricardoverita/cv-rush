<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A · Corporate Arcade · ATS 9000</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img"
        aria-label="ATS 9000 gate scanning runners; Ricardo collects his stack keywords and avoids buzzwords">
        <rect width="1600" height="900" fill="var(--sky)" />

        <g class="parallax-clouds">
          <use href="#a-cloud" x="80" y="80" width="170" height="68" />
          <use href="#a-cloud" x="520" y="50" width="150" height="60" />
          <use href="#a-cloud" x="1300" y="60" width="180" height="72" />
          <use href="#a-cloud" x="1800" y="80" width="180" height="72" />
        </g>

        <!-- far city -->
        <g class="parallax-far">
          <g stroke="var(--ink)" stroke-width="4">
            <rect x="0" y="480" width="130" height="320" rx="8" fill="#c7b9ff" />
            <rect x="130" y="430" width="90" height="370" rx="8" fill="#9fe3d6" />
            <rect x="760" y="460" width="120" height="340" rx="8" fill="#ffd0b0" />
          </g>
          <g fill="#fff6d8" opacity=".9">
            <rect x="22" y="510" width="18" height="22" /><rect x="62" y="555" width="18" height="22" /><rect x="22" y="600" width="18" height="22" />
            <rect x="150" y="460" width="16" height="20" /><rect x="186" y="505" width="16" height="20" />
            <rect x="780" y="490" width="18" height="22" /><rect x="830" y="535" width="18" height="22" />
          </g>
        </g>

        <!-- Kestrel Pay HQ, still ahead -->
        <use href="#a-hq" x="560" y="300" width="160" height="407" />

        <!-- ground + conveyor into the gate -->
        <rect x="0" y="800" width="1600" height="100" fill="var(--carpet)" />
        <rect x="0" y="800" width="1600" height="100" fill="url(#a-dots)" />
        <path d="M0 800 H1600" stroke="var(--ink)" stroke-width="6" />
        <g stroke="var(--ink)" stroke-width="5">
          <rect x="860" y="782" width="740" height="30" rx="15" fill="#4a4366" />
          <g fill="#8e86a8"><circle cx="890" cy="797" r="9" /><circle cx="990" cy="797" r="9" /><circle cx="1090" cy="797" r="9" /><circle cx="1190" cy="797" r="9" /><circle cx="1290" cy="797" r="9" /><circle cx="1390" cy="797" r="9" /><circle cx="1490" cy="797" r="9" /></g>
        </g>
        <g class="speedlines" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8">
          <path d="M300 690 h-70" /><path d="M290 720 h-50" /><path d="M310 750 h-80" />
        </g>

        <!-- the rejection chute and its bin ("We'll get back to you") -->
        <path d="M1352 470 Q1480 520 1530 680" fill="none" stroke="var(--ink)" stroke-width="44" stroke-linecap="round" />
        <path d="M1352 470 Q1480 520 1530 680" fill="none" stroke="var(--paper-shadow)" stroke-width="30" stroke-linecap="round" />
        <g stroke="var(--ink)" stroke-width="5">
          <path d="M1474 690 h120 l-12 110 h-96 z" fill="var(--lilac)" />
          <rect x="1466" y="676" width="136" height="22" rx="8" fill="#9d8ae6" />
        </g>
        <g transform="translate(1436 410) rotate(-6)">
          <rect width="150" height="38" rx="12" fill="#fff" stroke="var(--ink)" stroke-width="4" />
          <text x="75" y="26" text-anchor="middle" font-family="Lilita One" font-size="18" fill="var(--tomato)" data-s="ats.rejectedPile">Auto-rejected</text>
        </g>

        <!-- ATS 9000 -->
        <use href="#a-ats" x="900" y="200" width="460" height="600" />

        <!-- rejected applicant CVs sliding out -->
        <g transform="translate(1356 450)">
          <g class="reject-cv" style="--phase:0s"><use href="#a-cv" width="40" height="50" /><path d="M8 14 l24 26 M32 14 l-24 26" stroke="var(--tomato)" stroke-width="6" stroke-linecap="round" /></g>
          <g class="reject-cv" style="--phase:-1.2s"><use href="#a-cv" width="40" height="50" /><path d="M8 14 l24 26 M32 14 l-24 26" stroke="var(--tomato)" stroke-width="6" stroke-linecap="round" /></g>
        </g>

        <!-- keyword tokens (filled from the scenario) -->
        <g id="tokens"></g>

        <!-- Ricardo just grabbed a keyword -->
        <g transform="translate(470 584)"><g class="pop">
          <rect x="-58" y="-22" width="116" height="36" rx="18" fill="var(--teal)" stroke="var(--ink)" stroke-width="4" />
          <text y="4" text-anchor="middle" font-family="Lilita One" font-size="20" fill="#fff">+ Redis</text>
        </g></g>

        <!-- runners: Sofia passed, Mateo is being scanned, Ricardo collects, Alex trails -->
        <g class="advance"><use class="runner sofia" href="#a-dev" x="1350" y="640" width="120" height="152" style="--phase:-.1s" /></g>
        <use class="runner mateo" href="#a-dev" x="1060" y="640" width="120" height="152" style="--phase:-.2s" />
        <use class="runner ricardo" href="#a-dev" x="400" y="652" width="120" height="152" />
        <g class="fall-behind"><use class="runner alex" href="#a-dev" x="170" y="652" width="120" height="152" style="--phase:-.25s" /></g>
        <rect class="scrap" x="512" y="690" width="12" height="14" rx="2" fill="#fff" stroke="var(--ink)" stroke-width="2.5" />

        <g font-family="Lilita One" font-size="20" text-anchor="middle">
          <g class="advance"><g transform="translate(1398 630)"><rect x="-44" y="-22" width="88" height="30" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4" /><text y="1">SOFIA</text></g></g>
          <g transform="translate(1108 630)"><rect x="-46" y="-22" width="92" height="30" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4" /><text y="1">MATEO</text></g>
          <g transform="translate(448 642)"><rect x="-60" y="-24" width="120" height="34" rx="11" fill="var(--tomato)" stroke="var(--ink)" stroke-width="4" /><text y="2" fill="#fff" data-s="player.name">RICARDO</text></g>
          <g class="fall-behind"><g transform="translate(218 642)"><rect x="-38" y="-22" width="76" height="30" rx="10" fill="#fff" stroke="var(--ink)" stroke-width="4" /><text y="1">ALEX</text></g></g>
        </g>
      </svg>

      <div class="hud">
        <div class="player-card sticker">
          <div class="name" data-s="player.name">RICARDO</div>
          <div class="title" data-s="player.title">Senior Fullstack Developer</div>
          <div class="cv-meter">
            <span class="icon" aria-hidden="true"></span>
            <span class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span>
            <span>CV <span data-s="cvHealth">80</span>%</span>
          </div>
          <div class="stages" aria-label="Recruiter passed, ATS now, Hiring Manager and Final next">
            <span class="done">📞</span><span class="now">🤖</span><span>💼</span><span>🏢</span>
          </div>
        </div>

        <div class="question sticker ats">
          <span class="tab"><span data-s="ats.icon"></span> ATS 9000 · KEYWORD SCAN</span>
          <div class="match">
            <span class="label">MATCH <span data-s="ats.match">82</span>%</span>
            <div class="meter" aria-hidden="true"><span class="fill" style="width: 82%"></span><span class="line" style="left: 70%"></span></div>
          </div>
          <div class="chips" id="chips"></div>
          <div class="timer"><span data-s="ats.seconds">14</span></div>
        </div>

        <div class="race-status">
          <div class="score sticker"><small>SCORE</small><span data-s="score">12,480</span></div>
          <div class="position sticker"><div><b data-s="position">3rd</b><small>of 4</small></div></div>
        </div>

        <div class="hint sticker">
          <span class="desktop">Grab your stack, dodge the buzzwords · <kbd>Space</kbd> jump</span>
          <span class="phone">Grab your stack · dodge buzzwords</span>
        </div>

        <div class="touch"><div class="jump">JUMP</div></div>
      </div>

      <div class="rotate">
        <div class="phone" aria-hidden="true"></div>
        <div>Rotate your device to play</div>
      </div>
    </div>
    <script src="../shared/scenario.js"></script>
    <script src="sprites.js"></script>
    <script>
      // Keyword tokens: your stack (good) floats ahead; buzzwords (traps) are spiky.
      (function () {
        const ats = window.SCENARIO.ats;
        const at = {
          PHP: [640, 610],
          PostgreSQL: [780, 520],
          Ninja: [600, 460],
          '10x': [730, 720],
          Synergy: [850, 650],
          Spark: [790, 400],
        };
        const width = (label) => 54 + label.length * 13;
        const good = (label, [x, y], i) => {
          const w = width(label) + 26;
          return `<g transform="translate(${x} ${y})"><g class="token" style="--phase:-${i * 0.3}s">
            <rect x="${-w / 2}" y="-24" width="${w}" height="48" rx="24" fill="#fff" stroke="var(--ink)" stroke-width="5"/>
            <circle cx="${-w / 2 + 24}" cy="0" r="14" fill="var(--teal)" stroke="var(--ink)" stroke-width="3.5"/>
            <path d="M${-w / 2 + 24} -7 v14 M${-w / 2 + 17} 0 h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            <text x="${13}" y="8" text-anchor="middle" font-family="Lilita One" font-size="22" fill="var(--ink)">${label}</text>
          </g></g>`;
        };
        const trap = (label, [x, y], i) => {
          const w = width(label);
          const x0 = -w / 2;
          // A spiky badge: zig-zag top and bottom edges, pointed ends.
          let top = '';
          for (let px = x0; px < -x0; px += 16) top += ` L${px + 8} -28 L${Math.min(px + 16, -x0)} -20`;
          let bottom = '';
          for (let px = -x0; px > x0; px -= 16) bottom += ` L${px - 8} 28 L${Math.max(px - 16, x0)} 20`;
          return `<g transform="translate(${x} ${y})"><g class="token" style="--phase:-${i * 0.25}s">
            <path d="M${x0} -20${top} L${-x0 + 10} 0 L${-x0} 20${bottom} L${x0 - 10} 0 Z" fill="var(--tomato)" stroke="var(--ink)" stroke-width="4.5" stroke-linejoin="round"/>
            <text y="8" text-anchor="middle" font-family="Lilita One" font-size="21" fill="#fff">${label}</text>
          </g></g>`;
        };
        document.getElementById('tokens').innerHTML =
          ats.upcoming.map((t, i) => good(t, at[t], i)).join('') +
          ats.traps.map((t, i) => trap(t, at[t], i)).join('');
        document.getElementById('chips').innerHTML =
          ats.collected.map((t) => `<span>${t} ✓</span>`).join('') +
          ats.upcoming.map((t) => `<span class="todo">${t}</span>`).join('');
      })();
    </script>
  </body>
</html>
