<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C · Paper Trail · Race</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img"
        aria-label="A paper-craft office world: Ricardo runs third toward four archive-box doors A to D; Kestrel Pay HQ stands behind">
        <rect width="1600" height="900" fill="var(--kraft)" />
        <rect width="1600" height="900" fill="url(#c-grid)" />

        <g class="parallax-clouds">
          <use href="#c-cloud" x="120" y="80" width="170" height="68" />
          <use href="#c-cloud" x="980" y="110" width="190" height="76" />
          <use href="#c-cloud" x="1420" y="60" width="160" height="64" />
          <use href="#c-cloud" x="1840" y="90" width="180" height="72" />
        </g>

        <!-- "We'll get back to you": an envelope hanging from a clothespin, never sent -->
        <g transform="translate(250 160)">
          <path d="M-120 -10 Q90 24 300 -6" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".5" />
          <g class="dangle">
            <rect x="80" y="2" width="14" height="30" rx="3" fill="#C9A878" />
            <g filter="url(#c-shadow)">
              <rect x="10" y="26" width="160" height="96" fill="var(--card)" />
              <path d="M10 26 L90 80 L170 26" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".5" />
              <rect x="134" y="34" width="26" height="30" fill="var(--folder)" opacity=".7" />
              <text x="90" y="110" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="14" fill="var(--ink)">We'll get back to you</text>
            </g>
          </g>
        </g>

        <!-- far city: cut card -->
        <g class="parallax-far" filter="url(#c-shadow)">
          <rect x="0" y="470" width="120" height="330" fill="#CFE0EE" />
          <rect x="120" y="420" width="92" height="380" fill="#F3E7C9" />
          <rect x="212" y="500" width="140" height="300" fill="#DCEBDD" />
          <rect x="560" y="440" width="110" height="360" fill="#CFE0EE" />
          <rect x="890" y="480" width="110" height="320" fill="#F3E7C9" />
          <rect x="1000" y="420" width="100" height="380" fill="#DCEBDD" />
        </g>
        <g class="parallax-far" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".45">
          <rect x="20" y="500" width="18" height="24" /><rect x="58" y="500" width="18" height="24" /><rect x="20" y="545" width="18" height="24" /><rect x="58" y="590" width="18" height="24" />
          <rect x="140" y="450" width="16" height="22" /><rect x="176" y="490" width="16" height="22" /><rect x="140" y="530" width="16" height="22" />
          <rect x="580" y="470" width="18" height="24" /><rect x="618" y="510" width="18" height="24" /><rect x="580" y="555" width="18" height="24" />
          <rect x="1020" y="450" width="18" height="24" /><rect x="1058" y="495" width="18" height="24" />
        </g>
        <!-- Culture Fit poster with a puzzle-shaped hole -->
        <g class="parallax-far" transform="translate(226 520) rotate(-3)" filter="url(#c-shadow)">
          <rect width="112" height="98" fill="var(--card)" />
          <path d="M36 22 h14 a7 7 0 1 1 12 0 h14 v14 a7 7 0 1 0 0 12 v14 h-40 z" fill="var(--kraft-d)" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3" />
          <text x="56" y="88" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="15" fill="var(--ink)">CULTURE FIT</text>
        </g>

        <!-- Kestrel Pay HQ -->
        <use href="#c-hq" x="690" y="250" width="180" height="458" />

        <!-- Quick 15-minute call: a giant sticky note on a stick -->
        <g transform="translate(330 320)">
          <rect x="100" y="110" width="12" height="370" fill="#B98A55" />
          <g transform="rotate(3 110 60)" filter="url(#c-shadow-lg)">
            <rect x="-6" width="232" height="120" fill="var(--hl)" />
            <text x="110" y="44" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="24" fill="var(--ink)">Quick 15-min call</text>
            <path d="M40 54 H180" stroke="var(--ink)" stroke-width="1.5" opacity=".4" />
            <text x="110" y="92" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="26" fill="var(--stamp)">01:47:12</text>
          </g>
          <circle cx="110" cy="10" r="7" fill="var(--stamp)" />
        </g>

        <!-- ground: a strip of notebook paper -->
        <g id="ground"></g>

        <!-- 237 applicants: a take-a-number ticket -->
        <g transform="translate(20 680)">
          <rect x="72" y="50" width="10" height="70" fill="#B98A55" />
          <g filter="url(#c-shadow)" transform="rotate(-4 80 30)">
            <path d="M0 0 H160 V60 H0 Z" fill="var(--card)" />
            <path d="M0 0 V60 M160 0 V60" stroke="var(--kraft)" stroke-width="6" stroke-dasharray="4 4" />
            <text x="80" y="20" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="10" fill="var(--stamp)">TAKE A NUMBER</text>
            <text x="80" y="46" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="20" fill="var(--ink)" data-s="applicants">237 applicants</text>
          </g>
        </g>

        <!-- platforms: a ream of paper, then manila folders -->
        <g filter="url(#c-shadow)">
          <rect x="926" y="700" width="150" height="100" fill="var(--card)" />
          <rect x="926" y="740" width="150" height="34" fill="var(--folder)" />
          <text x="1001" y="763" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" fill="var(--card)">A4 · 500</text>
          <path d="M980 530 H1060 L1068 520 H1100 V552 H980 Z" fill="var(--manila)" />
          <path d="M1010 390 H1080 L1088 380 H1120 V412 H1010 Z" fill="var(--manila)" />
        </g>
        <g fill="none" stroke="#9AA3AE" stroke-width="3">
          <rect x="992" y="524" width="12" height="30" rx="6" /><rect x="1022" y="384" width="12" height="30" rx="6" />
        </g>

        <!-- the answer tower: archive boxes with flap doors -->
        <g id="doors"></g>

        <!-- path hint: a cut-here line toward door C -->
        <path d="M560 690 Q760 560 960 640 T1170 610" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-dasharray="12 10" opacity=".7" />
        <text x="530" y="700" font-size="30" fill="var(--ink)" transform="rotate(-30 545 690)">✂</text>

        <!-- obstacle: the take-home assignment -->
        <g transform="translate(736 700)" filter="url(#c-shadow)">
          <rect x="10" y="-12" width="140" height="112" fill="#EFE9DC" />
          <rect x="5" y="-6" width="140" height="106" fill="#F5F0E6" />
          <rect x="0" y="0" width="140" height="100" fill="var(--card)" />
          <path d="M14 12 h20" stroke="#9AA3AE" stroke-width="4" />
          <text x="70" y="40" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11.5" fill="var(--ink)">TAKE-HOME</text>
          <text x="70" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11.5" fill="var(--ink)">ASSIGNMENT</text>
          <text x="70" y="82" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="13" fill="var(--stamp)">47 pages</text>
        </g>

        <!-- runners (Sofia 1st, Mateo 2nd, Ricardo 3rd, Alex 4th) -->
        <g class="advance"><use class="runner sofia" href="#c-dev" x="985" y="352" width="118" height="190" style="--phase:-.15s" /></g>
        <g class="advance"><use class="runner mateo" href="#c-dev" x="600" y="622" width="118" height="190" style="--phase:-.3s" /></g>
        <use class="runner ricardo" href="#c-dev" x="400" y="622" width="118" height="190" />
        <g class="fall-behind"><use class="runner alex" href="#c-dev" x="170" y="622" width="118" height="190" style="--phase:-.4s" /></g>
        <path class="scrap" d="M506 704 l10 3 l-4 9 z" fill="var(--card)" stroke="var(--ink)" stroke-width="1" />

        <!-- name tags: paper labels -->
        <g font-family="IBM Plex Mono" font-weight="700" font-size="16" text-anchor="middle">
          <g class="advance"><g transform="translate(1040 340) rotate(-2)"><rect x="-40" y="-18" width="80" height="26" fill="var(--card)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)">SOFIA</text></g></g>
          <g class="advance"><g transform="translate(655 612) rotate(2)"><rect x="-42" y="-18" width="84" height="26" fill="var(--card)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)">MATEO</text></g></g>
          <g transform="translate(455 610) rotate(-2)"><rect x="-56" y="-20" width="112" height="30" fill="var(--hl)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)" data-s="player.name">RICARDO</text></g>
          <g class="fall-behind"><g transform="translate(225 612) rotate(1)"><rect x="-34" y="-18" width="68" height="26" fill="var(--card)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)">ALEX</text></g></g>
        </g>
      </svg>

      <div class="hud">
        <div class="player-card card">
          <div class="name" data-s="player.name">RICARDO</div>
          <div class="title" data-s="player.title">Senior Fullstack Developer</div>
          <div class="cv-meter">
            <span class="icon" aria-hidden="true"></span>
            <span class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span>
            <span>CV <span data-s="cvHealth">80</span>%</span>
          </div>
          <div class="stages" aria-label="Recruiter passed, ATS passed, Hiring Manager now, Final next">
            <span class="done">REC ✓</span><span class="done">ATS ✓</span><span class="now">HIRING MGR</span><span>FINAL</span>
          </div>
        </div>

        <div class="question card">
          <span class="tab">HIRING MANAGER · <span data-s="technical.counter"></span></span>
          <span class="timer">0:0<span data-s="technical.seconds">9</span></span>
          <div class="prompt" data-s="technical.prompt">Which Redis structure fits a real-time leaderboard?</div>
        </div>

        <div class="race-status">
          <div class="score card">SCORE<b data-s="score">12,480</b></div>
          <div class="position"><div><b data-s="position">3rd</b><small>of 4</small></div></div>
        </div>

        <div class="hint card">
          <span class="desktop">Run through a door · <kbd>↑</kbd> <kbd>↓</kbd> or <kbd>1</kbd>–<kbd>4</kbd></span>
          <span class="phone">Tap a label to pick</span>
        </div>

        <div class="touch"><div class="jump">JUMP</div></div>
      </div>

      <div class="rotate">
        <div class="phone" aria-hidden="true"></div>
        <div>Rotate your device to play</div>
      </div>
    </div>
    <script src="../shared/scenario.js"></script>
    <script src="sprites.js"></script>
    <script src="scene.js"></script>
    <script>
      window.notebookGround('ground');
      window.answerBoxes('doors', window.SCENARIO.technical);
    </script>
  </body>
</html>
