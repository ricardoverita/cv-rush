<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C · Paper Trail · Recruiter</title>
    <link rel="stylesheet" href="../shared/frame.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <svg class="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" role="img"
        aria-label="A paper recruiter at a pop-up desk speaks on a sticky note; four archive-box doors answer where the role is based">
        <rect width="1600" height="900" fill="var(--kraft)" />
        <rect width="1600" height="900" fill="url(#c-grid)" />

        <g class="parallax-clouds">
          <use href="#c-cloud" x="160" y="70" width="170" height="68" />
          <use href="#c-cloud" x="1180" y="60" width="190" height="76" />
          <use href="#c-cloud" x="1820" y="80" width="180" height="72" />
        </g>

        <g class="parallax-far" filter="url(#c-shadow)">
          <rect x="0" y="460" width="110" height="340" fill="#F3E7C9" />
          <rect x="110" y="520" width="130" height="280" fill="#CFE0EE" />
          <rect x="880" y="470" width="110" height="330" fill="#DCEBDD" />
          <rect x="990" y="430" width="100" height="370" fill="#CFE0EE" />
        </g>
        <g class="parallax-far" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".45">
          <rect x="20" y="490" width="18" height="24" /><rect x="60" y="535" width="18" height="24" /><rect x="130" y="550" width="18" height="24" /><rect x="170" y="595" width="18" height="24" />
          <rect x="900" y="500" width="18" height="24" /><rect x="940" y="545" width="18" height="24" /><rect x="1010" y="460" width="18" height="24" /><rect x="1050" y="505" width="18" height="24" />
        </g>

        <use href="#c-hq" x="780" y="260" width="170" height="433" />

        <!-- pinned index card: salary -->
        <g transform="translate(20 470) rotate(-3)" filter="url(#c-shadow)">
          <rect width="190" height="92" fill="var(--card)" />
          <rect y="22" width="190" height="1.5" fill="var(--stamp)" opacity=".6" />
          <text x="12" y="17" font-family="IBM Plex Mono" font-weight="700" font-size="11" fill="var(--stamp)">SALARY RANGE</text>
          <text x="95" y="66" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="26" fill="var(--ink)">Competitive</text>
          <circle cx="95" cy="4" r="6" fill="var(--stamp)" />
        </g>

        <g id="ground"></g>

        <!-- the recruiter's pop-up desk -->
        <g class="talk"><use href="#c-recruiter" x="520" y="532" width="170" height="170" /></g>
        <g filter="url(#c-shadow-lg)">
          <rect x="440" y="680" width="330" height="18" fill="#B98A55" />
          <path d="M456 698 H754 V800 H456 Z" fill="var(--folder)" />
          <path d="M470 680 L540 640 L610 680 Z" fill="var(--card)" />
          <text x="540" y="674" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="11" fill="var(--ink)">TALENT</text>
        </g>
        <text x="605" y="760" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="30" fill="var(--card)">Talent Team</text>
        <!-- desk phone with a curly cord -->
        <g filter="url(#c-shadow)">
          <rect x="690" y="652" width="60" height="30" rx="6" fill="var(--ink)" />
          <rect x="684" y="640" width="72" height="16" rx="8" fill="#3A4A6A" />
        </g>
        <path d="M700 682 q-6 10 4 14 q10 4 4 14 q-6 10 4 14" fill="none" stroke="var(--ink)" stroke-width="2.5" />

        <!-- the recruiter's line, on a sticky note -->
        <g transform="translate(150 372) rotate(-1.5)" filter="url(#c-shadow-lg)">
          <rect width="470" height="110" fill="var(--hl)" />
          <path d="M380 110 L420 150 L410 110 Z" fill="var(--hl)" />
          <foreignObject x="18" y="14" width="434" height="86">
            <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Fraunces; font-weight: 800; font-size: 28px; line-height: 1.15; color: #22304A" data-s="recruiter.line">Hi Ricardo! Got 15 minutes? Quick one…</div>
          </foreignObject>
        </g>

        <!-- platforms -->
        <g filter="url(#c-shadow)">
          <rect x="926" y="700" width="150" height="100" fill="var(--card)" />
          <rect x="926" y="740" width="150" height="34" fill="var(--folder)" />
          <text x="1001" y="763" text-anchor="middle" font-family="IBM Plex Mono" font-weight="700" font-size="13" fill="var(--card)">A4 · 500</text>
          <path d="M980 530 H1060 L1068 520 H1100 V552 H980 Z" fill="var(--manila)" />
          <path d="M1010 390 H1080 L1088 380 H1120 V412 H1010 Z" fill="var(--manila)" />
        </g>
        <g fill="none" stroke="#9AA3AE" stroke-width="3">
          <rect x="992" y="524" width="12" height="30" rx="6" /><rect x="1022" y="384" width="12" height="30" rx="6" />
        </g>

        <g id="doors"></g>
        <path d="M470 610 Q720 500 960 680 Q990 580 1030 525 Q1050 440 1070 385 Q1110 330 1170 330" fill="none" stroke="var(--ink)" stroke-width="3.5" stroke-dasharray="12 10" opacity=".7" />

        <!-- runners -->
        <g class="advance"><use class="runner sofia" href="#c-dev" x="985" y="352" width="118" height="190" style="--phase:-.15s" /></g>
        <g class="advance"><use class="runner mateo" href="#c-dev" x="800" y="622" width="118" height="190" style="--phase:-.3s" /></g>
        <use class="runner ricardo" href="#c-dev" x="330" y="622" width="118" height="190" />
        <g class="fall-behind"><use class="runner alex" href="#c-dev" x="110" y="622" width="118" height="190" style="--phase:-.4s" /></g>
        <path class="scrap" d="M436 704 l10 3 l-4 9 z" fill="var(--card)" stroke="var(--ink)" stroke-width="1" />

        <g font-family="IBM Plex Mono" font-weight="700" font-size="16" text-anchor="middle">
          <g class="advance"><g transform="translate(1040 340) rotate(-2)"><rect x="-40" y="-18" width="80" height="26" fill="var(--card)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)">SOFIA</text></g></g>
          <g class="advance"><g transform="translate(855 612) rotate(2)"><rect x="-42" y="-18" width="84" height="26" fill="var(--card)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)">MATEO</text></g></g>
          <g transform="translate(385 610) rotate(-2)"><rect x="-56" y="-20" width="112" height="30" fill="var(--hl)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)" data-s="player.name">RICARDO</text></g>
          <g class="fall-behind"><g transform="translate(165 612) rotate(1)"><rect x="-34" y="-18" width="68" height="26" fill="var(--card)" filter="url(#c-shadow)" /><text y="1" fill="var(--ink)">ALEX</text></g></g>
        </g>
      </svg>

      <div class="hud">
        <div class="player-card card">
          <div class="name" data-s="player.name">RICARDO</div>
          <div class="title" data-s="player.title">Senior Fullstack Developer</div>
          <div class="cv-meter">
            <span class="icon" aria-hidden="true"></span>
            <span class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span>
            <span>CV <span data-s="cvHealth">80</span>%</span>
          </div>
          <div class="stages" aria-label="Recruiter now; ATS, Hiring Manager and Final next">
            <span class="now">RECRUITER</span><span>ATS 9000</span><span>HIRING MGR</span><span>FINAL</span>
          </div>
        </div>

        <div class="question card">
          <span class="tab">RECRUITER · <span data-s="recruiter.counter"></span></span>
          <span class="timer">0:0<span data-s="recruiter.seconds">7</span></span>
          <div class="prompt" data-s="recruiter.prompt">Where is the role based?</div>
        </div>

        <div class="race-status">
          <div class="score card">SCORE<b data-s="score">12,480</b></div>
          <div class="position"><div><b data-s="position">3rd</b><small>of 4</small></div></div>
        </div>

        <div class="hint card">
          <span class="desktop">Run through a door · <kbd>↑</kbd> <kbd>↓</kbd> or <kbd>1</kbd>–<kbd>4</kbd></span>
          <span class="phone">Tap a label to pick</span>
        </div>

        <div class="touch"><div class="jump">JUMP</div></div>
      </div>

      <div class="rotate">
        <div class="phone" aria-hidden="true"></div>
        <div>Rotate your device to play</div>
      </div>
    </div>
    <script src="../shared/scenario.js"></script>
    <script src="sprites.js"></script>
    <script src="scene.js"></script>
    <script>
      window.notebookGround('ground');
      window.answerBoxes('doors', window.SCENARIO.recruiter);
    </script>
  </body>
</html>
